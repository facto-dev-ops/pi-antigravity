<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="pi-plugin-chrome" content="v2">
  <title data-i18n="appTitle">编辑账户 - Antigravity 模型设置</title>
  <style>
    :root {
      --bg-page: #fbf5ee;
      --bg-card: #f8ebe0;
      --border-card: #ebd6c7;
      --border-input: #ebd3c3;
      --bg-input: #f5dfd1;
      --bg-input-focus: #fffdfb;
      --bg-row-hover: rgba(0, 0, 0, 0.035);
      --bg-row-selected: #f6d2cc;
      --text-selected: #2d130e;
      --accent-red: #a82323;
      --accent-red-hover: #8e1b1b;
      --accent-red-badge: #c53030;
      --text-primary: #331f16;
      --text-secondary: #6e594d;
      --text-muted: #887265;
      --badge-bg: #edd6c8;
      --badge-text: #573f32;
      --modal-overlay: rgba(30, 20, 15, 0.45);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #1a1817;
        --bg-card: #24211f;
        --border-card: #38332f;
        --border-input: #3d3733;
        --bg-input: #2b2724;
        --bg-input-focus: #1f1d1b;
        --bg-row-hover: rgba(255, 255, 255, 0.04);
        --bg-row-selected: rgba(185, 28, 28, 0.28);
        --text-selected: #fde8e8;
        --accent-red: #c53030;
        --accent-red-hover: #a82323;
        --accent-red-badge: #dc2626;
        --text-primary: #ede4dc;
        --text-secondary: #b5a59a;
        --text-muted: #83756b;
        --badge-bg: #352e2a;
        --badge-text: #d8c8bd;
        --modal-overlay: rgba(0, 0, 0, 0.65);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-family);
      font-size: 13px;
      line-height: 1.5;
      user-select: none;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 18px 24px 20px;
    }

    /* Header */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dialog-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }

    .btn-advanced-link {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }

    .btn-advanced-link:hover {
      background: var(--bg-row-hover);
      color: var(--text-primary);
    }

    /* Name field */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .field-label {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .input-name {
      width: 100%;
      background: var(--bg-input-focus);
      border: 1px solid var(--border-card);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input-name:focus {
      border-color: var(--accent-red);
      box-shadow: 0 0 0 2px rgba(168, 35, 35, 0.15);
    }

    /* Main Two-Column Layout */
    .main-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      flex: 1;
      min-height: 0;
    }

    .panel-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      min-height: 0;
      overflow: hidden;
    }

    /* Card Header */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }

    .card-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .select-all-btn {
      width: 18px;
      height: 18px;
      background: var(--accent-red);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      line-height: 1;
      border: none;
    }

    .select-all-btn svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .btn-pill-fetch {
      background: var(--bg-input);
      border: 1px solid var(--border-card);
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 12px;
      color: var(--text-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-pill-fetch:hover {
      background: #ebd4c6;
    }

    .btn-pill-fetch.loading svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      background: var(--bg-input);
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 4px 10px 4px 26px;
      font-size: 12px;
      color: var(--text-primary);
      width: 145px;
      outline: none;
      transition: width 0.2s, background 0.15s, border-color 0.15s;
    }

    .search-input:focus {
      background: var(--bg-input-focus);
      border-color: var(--border-card);
      width: 170px;
    }

    .search-icon {
      position: absolute;
      left: 7px;
      width: 13px;
      height: 13px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .count-badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 11px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 10px;
    }

    /* List Area */
    .model-list {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-right: 4px;
    }

    /* Scrollbar */
    .model-list::-webkit-scrollbar {
      width: 5px;
    }
    .model-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .model-list::-webkit-scrollbar-thumb {
      background: var(--border-card);
      border-radius: 4px;
    }

    .model-row {
      display: flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 6px;
      gap: 10px;
      cursor: pointer;
      transition: background 0.12s;
    }

    .model-row:hover {
      background: var(--bg-row-hover);
    }

    .model-row.selected {
      background: var(--bg-row-selected);
      color: var(--text-selected);
    }

    /* Custom Checkbox */
    .custom-checkbox {
      width: 16px;
      height: 16px;
      border: 1.5px solid #a89488;
      border-radius: 4px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .model-row.selected .custom-checkbox {
      background: var(--accent-red);
      border-color: var(--accent-red);
    }

    .custom-checkbox svg {
      width: 10px;
      height: 10px;
      stroke: #fff;
      stroke-width: 2.5;
      fill: none;
      display: none;
    }

    .model-row.selected .custom-checkbox svg {
      display: block;
    }

    .model-info-cell {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .model-id-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      color: inherit;
      white-space: nowrap;
    }

    .model-name-label {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .model-spec-badge {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-left: auto;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Right column items */
    .configured-row {
      display: flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 6px;
      gap: 8px;
      background: transparent;
      transition: background 0.12s;
    }

    .configured-row:hover {
      background: var(--bg-row-hover);
    }

    .drag-handle {
      color: var(--text-muted);
      cursor: grab;
      font-size: 14px;
      padding: 0 2px;
      line-height: 1;
      display: flex;
      align-items: center;
    }

    .configured-row .model-id-mono {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-actions-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .btn-pill-advanced {
      background: var(--badge-bg);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 2px 9px;
      font-size: 11px;
      color: var(--text-primary);
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-pill-advanced:hover {
      background: #e3ccbc;
    }

    .btn-remove-model {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
    }

    .btn-remove-model:hover {
      color: var(--accent-red);\n      background: var(--bg-row-hover);
    }

    /* Custom model entry in right card */
    .custom-model-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-card);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .custom-title-row {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .help-tooltip-icon {
      cursor: help;
      color: var(--text-muted);
      font-size: 12px;
    }

    .custom-input-row {
      display: flex;
      gap: 8px;
    }

    .input-custom-id {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border-input);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12.5px;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .input-custom-id:focus {
      background: var(--bg-input-focus);
      border-color: var(--accent-red);
    }

    .btn-add-custom {
      background: var(--bg-input);
      border: 1px solid var(--border-input);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .btn-add-custom:hover {
      background: #ebd2c1;
    }

    /* Empty state */
    .empty-list-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 12.5px;
      font-style: italic;
      padding: 24px;
      text-align: center;
    }

    /* Footer Buttons */
    .footer-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    .btn-cancel {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 14px;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }

    .btn-cancel:hover {
      background: var(--bg-row-hover);
      color: var(--text-primary);
    }

    .btn-save {
      background: var(--accent-red);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 24px;
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(168, 35, 35, 0.25);
      transition: background 0.15s, transform 0.05s;
    }

    .btn-save:hover {
      background: var(--accent-red-hover);
    }

    .btn-save:active {
      transform: translateY(1px);
    }

    /* Modal dialog for Advanced Settings */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--modal-overlay);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-dialog {
      background: var(--bg-page);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      width: 480px;
      max-width: 90vw;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-card);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .modal-close-btn {
      background: none;
      border: none;
      font-size: 18px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .modal-close-btn:hover {
      color: var(--text-primary);
      background: var(--bg-row-hover);
    }

    .modal-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 70vh;
      overflow-y: auto;
    }

    .modal-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .modal-field-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .modal-field-hint {
      font-size: 11px;
      color: var(--text-muted);
    }

    .modal-input {
      background: var(--bg-input-focus);
      border: 1px solid var(--border-card);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      color: var(--text-primary);
      outline: none;
    }

    .modal-input:focus {
      border-color: var(--accent-red);
    }

    .modal-select {
      background: var(--bg-input-focus);
      border: 1px solid var(--border-card);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      color: var(--text-primary);
      outline: none;
    }

    .thinking-checkboxes {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border-card);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: var(--bg-card);
    }

    /* Notification toast */
    .toast-pill {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #2b1f1a;
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 500;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      transition: transform 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 20000;
      pointer-events: none;
    }

    .toast-pill.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <div class="header-row">
      <h2 class="dialog-title" data-i18n="dialogTitle">编辑账户</h2>
      <div class="header-actions">
        <button type="button" class="btn-advanced-link" id="btnToggleLocale" title="切换语言">English</button>
        <button type="button" class="btn-advanced-link" id="btnHeaderAdvanced" data-i18n="btnHeaderAdvanced">高级设置</button>
      </div>
    </div>

    <!-- Account Name -->
    <div class="field-group">
      <label class="field-label" for="accountNameInput" data-i18n="accountNameLabel">名称</label>
      <input type="text" class="input-name" id="accountNameInput" value="Google Antigravity" data-i18n-placeholder="accountNamePlaceholder" placeholder="输入账户显示名称">
    </div>

    <!-- Columns -->
    <div class="main-columns">
      <!-- Left Card: Available Models -->
      <div class="panel-card">
        <div class="card-header">
          <div class="card-header-left">
            <button type="button" class="select-all-btn" id="btnToggleAll" title="反选 / 全选" data-i18n-title="btnToggleAllTitle" data-i18n-aria="btnToggleAllAria" aria-label="反选 / 全选">
              <svg viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg>
            </button>
            <span class="card-title" data-i18n="availableModelsTitle">该账号的模型</span>
            <button type="button" class="btn-pill-fetch" id="btnFetchRemote" data-i18n-title="btnFetchRemoteTitle" title="获取最新可用模型列表">
              <svg id="fetchIcon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
              </svg>
              <span data-i18n="btnFetchRemote">获取列表</span>
            </button>
          </div>
          <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" class="search-input" id="searchAvailableInput" placeholder="搜索模型 ID..." data-i18n-placeholder="searchAvailablePlaceholder" data-i18n-aria="searchAvailableAria" aria-label="搜索模型 ID...">
          </div>
        </div>

        <div class="model-list" id="availableModelsList">
          <!-- Dynamically populated rows -->
        </div>
      </div>

      <!-- Right Card: Configured Models -->
      <div class="panel-card">
        <div class="card-header">
          <div class="card-header-left">
            <span class="card-title" data-i18n="configuredModelsTitle">模型设置</span>
            <span class="count-badge" id="configuredCountBadge" data-i18n-aria="configuredCountAria" aria-label="已配置模型数量">0</span>
          </div>
          <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" class="search-input" id="searchConfiguredInput" placeholder="搜索已添加模型..." data-i18n-placeholder="searchConfiguredPlaceholder" data-i18n-aria="searchConfiguredAria" aria-label="搜索已添加模型...">
          </div>
        </div>

        <div class="model-list" id="configuredModelsList">
          <!-- Dynamically populated configured rows -->
        </div>

        <!-- Custom model adder inside right card -->
        <div class="custom-model-section">
          <div class="custom-title-row">
            <span data-i18n="customSectionTitle">自定义</span>
            <span class="help-tooltip-icon" title="添加尚未在默认目录中公布的 Antigravity 或 Gemini 格式模型 ID" data-i18n-title="customTooltipTitle" data-i18n-aria="customTooltipAria" aria-label="添加尚未在默认目录中公布的 Antigravity 或 Gemini 格式模型 ID">?</span>
          </div>
          <div class="custom-input-row">
            <input type="text" class="input-custom-id" id="customModelIdInput" placeholder="输入模型 ID，如 gemini-2.5-flash" data-i18n-placeholder="customModelPlaceholder" data-i18n-aria="customModelAria" aria-label="输入模型 ID，如 gemini-2.5-flash">
            <button type="button" class="btn-add-custom" id="btnAddCustomModel" data-i18n="btnAddCustomModel">+ 添加自定义模型</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer Actions -->
    <div class="footer-actions">
      <button type="button" class="btn-cancel" id="btnCancel" data-i18n="btnCancel">取消</button>
      <button type="button" class="btn-save" id="btnSave" data-i18n="btnSave">保存</button>
    </div>
  </div>

  <!-- Advanced Model Modal -->
  <div class="modal-overlay" id="modelAdvancedModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="advancedModalTitle" data-i18n="advModalTitle">高级设置</h3>

        toastEnterValidId: "Please enter a valid model ID",
        toastModelAlreadyAdded: "This model is already in the list",
        toastModelAdded: "Model added: {id}",
        toastCustomModelAdded: "Custom model added successfully: {id}",
        toastRemoteSyncSuccess: "Synced latest available models from cloud",
        toastRemoteRefreshed: "Model list refreshed",
        toastRemoteFetchFailed: "Failed to fetch model list: {error}",
        toastSelectAtLeastOne: "Please select or add at least one active model",
        toastSaveSuccess: "Successfully saved {count} models! Synced to Desktop",
        toastHostUpdated: "Antigravity models updated ({count} active)",
        toastSaveFailed: "Save failed: {error}",
        unknownError: "Unknown error"
      }
    };
    if (typeof window !== "undefined") {
      window.I18N_STRINGS = I18N_STRINGS;
    }

    let currentLocale = "zh-CN";

    function normalizeLocale(raw) {
      if (!raw || typeof raw !== "string") return "zh-CN";
      const lower = raw.trim().toLowerCase();
      if (lower.startsWith("zh")) return "zh-CN";
      return "en";
    }

    function t(key, params) {
      const currentDict = I18N_STRINGS[currentLocale];
      const fallbackDict = I18N_STRINGS["zh-CN"];
      let text = (currentDict && currentDict[key]) ?? (fallbackDict && fallbackDict[key]) ?? key;
      if (typeof text !== "string") text = String(text);
      if (params && typeof params === "object") {
        for (const [k, v] of Object.entries(params)) {
          text = text.replace(new RegExp(`\\{${k}\\}`, "g"), String(v));
        }
      }
      return text;
    }

    function applyStaticI18n() {
      document.title = t("appTitle");
      document.documentElement.lang = currentLocale;

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (key) el.textContent = t(key);
      });

      document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
        const key = el.getAttribute("data-i18n-placeholder");
        if (key) el.placeholder = t(key);
      });

      document.querySelectorAll("[data-i18n-title]").forEach(el => {
        const key = el.getAttribute("data-i18n-title");
        if (key) el.title = t(key);
      });

      document.querySelectorAll("[data-i18n-aria]").forEach(el => {
        const key = el.getAttribute("data-i18n-aria");
        if (key) el.setAttribute("aria-label", t(key));
      });

      document.querySelectorAll("[data-i18n-value]").forEach(el => {
        const key = el.getAttribute("data-i18n-value");
        if (key) el.value = t(key);
      });

      const toggleBtn = document.getElementById("btnToggleLocale");
      if (toggleBtn) {
        toggleBtn.textContent = t("btnLocaleToggle");
        toggleBtn.title = t("btnLocaleToggleTitle");
        toggleBtn.setAttribute("aria-label", t("btnLocaleToggleTitle"));
      }
    }

    function setLocale(newLocale) {
      currentLocale = normalizeLocale(newLocale);
      applyStaticI18n();
      if (currentEditingAdvModelId) {
        document.getElementById("advancedModalTitle").textContent = `${t("advModalTitle")} · ${currentEditingAdvModelId}`;
      }
      renderAvailableList();
      renderConfiguredList();
    }

    function toggleLocale() {
      setLocale(currentLocale === "zh-CN" ? "en" : "zh-CN");
    }

    async function detectInitialLocale() {
      try {
        if (window.pluginBridge && typeof window.pluginBridge.invoke === "function") {
          const res = await window.pluginBridge.invoke("app.getLocale", {});
          if (typeof res === "string" && res) return normalizeLocale(res);
          if (res && typeof res.locale === "string" && res.locale) return normalizeLocale(res.locale);
        }
      } catch {
        // Host might not support app.getLocale; catch and fallback
      }
      if (typeof navigator !== "undefined" && navigator.language) {
        return normalizeLocale(navigator.language);
      }
      return "zh-CN";
    }

    // Mock for browser environment or dev test
    if (typeof window.pluginBridge === "undefined") {
      window.pluginBridge = {
        async invoke(channel, payload) {
          console.log("[pluginBridge mock invoke]", channel, payload);
          if (channel === "app.getLocale") {
            const navLocale = typeof navigator !== "undefined" && navigator.language ? navigator.language : "zh-CN";
            return { ok: true, locale: navLocale };
          }
          if (channel === "antigravity:get-config") {
            return {
              ok: true,
              accountName: "OpenAI (ChatGPT Plus/Pro)",
              allModels: [
                { id: "gemini-3.8-flash", name: "Gemini 3.8 Flash (Antigravity)", contextWindow: 1048576, maxTokens: 65536, supportsImages: true, thinkingLevels: ["low", "medium", "high"], defaultThinkingLevel: "low" },
                { id: "gemini-3.7-flash", name: "Gemini 3.7 Flash (Antigravity)", contextWindow: 1048576, maxTokens: 65536, supportsImages: true, thinkingLevels: ["low", "medium", "high"], defaultThinkingLevel: "low" },
                { id: "gemini-3.6-flash", name: "Gemini 3.6 Flash (Antigravity)", contextWindow: 1048576, maxTokens: 65536, supportsImages: true, thinkingLevels: ["low", "medium", "high"], defaultThinkingLevel: "low" },
                { id: "claude-opus-4-6", name: "Claude Opus 4.6 (Antigravity)", contextWindow: 250000, maxTokens: 64000, supportsImages: true, thinkingLevels: ["high"], defaultThinkingLevel: "high" },
                { id: "claude-sonnet-4-6", name: "Claude Sonnet 4.6 (Antigravity)", contextWindow: 200000, maxTokens: 64000, supportsImages: true, thinkingLevels: ["high"], defaultThinkingLevel: "high" },
                { id: "gemini-3.1-pro", name: "Gemini 3.1 Pro (Antigravity)", contextWindow: 1048576, maxTokens: 65535, supportsImages: true, thinkingLevels: ["low", "high"], defaultThinkingLevel: "low" },
                { id: "gemini-3.5-flash", name: "Gemini 3.5 Flash (Antigravity)", contextWindow: 1048576, maxTokens: 65536, supportsImages: true, thinkingLevels: ["low", "medium", "high"], defaultThinkingLevel: "low" },
                { id: "gpt-oss-120b", name: "GPT-OSS 120B (Antigravity)", contextWindow: 131072, maxTokens: 32768, supportsImages: false, thinkingLevels: ["medium"], defaultThinkingLevel: "medium" }
              ],
              configuredModelIds: ["gemini-3.8-flash", "claude-sonnet-4-6", "gemini-3.1-pro"],
              savedModelSettings: []
            };
          }
          if (channel === "antigravity:save-config") {
            return { ok: true, count: payload.models.length };
          }
          if (channel === "antigravity:fetch-models") {
            return { ok: true, source: "mock", models: [] };
          }
          if (channel === "ui.closePanel") {
            window.close();
            return { ok: true };
          }
          return { ok: true };
        },
        on(event, handler) { return () => {}; }
      };
    }

    // Application State
    let allModelsMap = new Map(); // id -> modelConfig
    let configuredIds = []; // ordered list of model IDs
    let currentEditingAdvModelId = null;

    function formatSpec(ctx, max) {
      const formatNum = (n) => {
        if (!n) return "0";
        if (n >= 1048576) return (n / 1048576).toFixed(2).replace(/\.00$/, "") + "M";
        if (n >= 1000000) return (n / 1000000).toFixed(2).replace(/\.00$/, "") + "M";
        if (n >= 1024) return Math.round(n / 1024) + "K";
        if (n >= 1000) return Math.round(n / 1000) + "K";
        return n.toString();
      };
      return `${formatNum(ctx)} · ${formatNum(max)}`;
    }

    function showToast(text) {
      const toast = document.getElementById("toastPill");
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    // Render Left List (Available Models)
    function renderAvailableList() {
      const container = document.getElementById("availableModelsList");
      const search = (document.getElementById("searchAvailableInput").value || "").trim().toLowerCase();
      container.innerHTML = "";

      const models = Array.from(allModelsMap.values());
      const filtered = models.filter(m => {
        if (!search) return true;
        return m.id.toLowerCase().includes(search) || (m.name && m.name.toLowerCase().includes(search));
      });

      if (filtered.length === 0) {
        const hint = document.createElement("div");
        hint.className = "empty-list-hint";
        hint.textContent = t("emptyAvailableList");
        container.appendChild(hint);
        return;
      }

      filtered.forEach(m => {
        const isSelected = configuredIds.includes(m.id);
        const row = document.createElement("div");
        row.className = `model-row ${isSelected ? "selected" : ""}`;
        row.setAttribute("data-id", m.id);

        row.innerHTML = `
          <div class="custom-checkbox">
            <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
          </div>
          <div class="model-info-cell">
            <span class="model-id-mono"></span>
            <span class="model-name-label"></span>
          </div>
          <span class="model-spec-badge"></span>
        `;

        const idMono = row.querySelector(".model-id-mono");
        idMono.textContent = m.id;

        const nameLabel = row.querySelector(".model-name-label");
        nameLabel.textContent = m.name || m.id;

        const specBadge = row.querySelector(".model-spec-badge");
        specBadge.textContent = formatSpec(m.contextWindow, m.maxTokens);

        row.addEventListener("click", () => {
          toggleModel(m.id);
        });

        container.appendChild(row);
      });
    }

    // Render Right List (Configured Models with reordering and advanced button)
    function renderConfiguredList() {
      const container = document.getElementById("configuredModelsList");
      const search = (document.getElementById("searchConfiguredInput").value || "").trim().toLowerCase();
      container.innerHTML = "";

      document.getElementById("configuredCountBadge").textContent = configuredIds.length;

      const filteredIds = configuredIds.filter(id => {
        if (!search) return true;
        const m = allModelsMap.get(id);
        return id.toLowerCase().includes(search) || (m && m.name && m.name.toLowerCase().includes(search));
      });

      if (filteredIds.length === 0) {
        const hint = document.createElement("div");
        hint.className = "empty-list-hint";
        hint.textContent = t("emptyConfiguredList");
        container.appendChild(hint);
        return;
      }

      filteredIds.forEach((id, index) => {
        const m = allModelsMap.get(id) || { id, name: id, contextWindow: 1048576, maxTokens: 65536 };
        const row = document.createElement("div");
        row.className = "configured-row";
        row.setAttribute("draggable", "true");
        row.setAttribute("data-id", id);
        row.setAttribute("data-index", String(index));

        row.innerHTML = `
          <span class="drag-handle">⠿</span>
          <span class="model-id-mono"></span>
          <div class="row-actions-group">
            <span class="model-spec-badge"></span>
            <button type="button" class="btn-pill-advanced"></button>
            <button type="button" class="btn-remove-model">×</button>
          </div>
        `;

        const dragHandle = row.querySelector(".drag-handle");
        dragHandle.title = t("dragHandleTitle");

        const idMono = row.querySelector(".model-id-mono");
        idMono.textContent = id;
        idMono.title = m.name || id;

        const specBadge = row.querySelector(".model-spec-badge");
        specBadge.textContent = formatSpec(m.contextWindow, m.maxTokens);

        const advBtn = row.querySelector(".btn-pill-advanced");
        advBtn.textContent = t("btnAdvancedModel");
        advBtn.title = t("btnAdvancedModelTitle");
        advBtn.setAttribute("data-adv", id);

        const removeBtn = row.querySelector(".btn-remove-model");
        removeBtn.title = t("btnRemoveModelTitle");
        removeBtn.setAttribute("aria-label", t("btnRemoveModelAria"));
        removeBtn.setAttribute("data-remove", id);

        // Advanced button
        advBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          openAdvancedModal(id);
        });

        // Remove button
        removeBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          removeConfiguredModel(id);
        });

        // Drag and drop sorting
        setupDragEvents(row, id);

        container.appendChild(row);
      });
    }

    // Drag-and-drop logic
    let draggedId = null;
    function setupDragEvents(row, id) {
      row.addEventListener("dragstart", (e) => {
        draggedId = id;
        e.dataTransfer.effectAllowed = "move";
        row.style.opacity = "0.4";
      });

      row.addEventListener("dragend", () => {
        draggedId = null;
        row.style.opacity = "1";
      });

      row.addEventListener("dragover", (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
      });

      row.addEventListener("drop", (e) => {
        e.preventDefault();
        if (!draggedId || draggedId === id) return;
        const fromIndex = configuredIds.indexOf(draggedId);
        const toIndex = configuredIds.indexOf(id);
        if (fromIndex !== -1 && toIndex !== -1) {
          configuredIds.splice(fromIndex, 1);
          configuredIds.splice(toIndex, 0, draggedId);
          renderConfiguredList();
        }
      });
    }

    function toggleModel(id) {
      const idx = configuredIds.indexOf(id);
      if (idx === -1) {
        configuredIds.push(id);
      } else {
        configuredIds.splice(idx, 1);
      }
      renderAvailableList();
      renderConfiguredList();
    }

    function removeConfiguredModel(id) {
      const idx = configuredIds.indexOf(id);
      if (idx !== -1) {
        configuredIds.splice(idx, 1);
        renderAvailableList();
        renderConfiguredList();
      }
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Advanced Model Settings Modal
    function openAdvancedModal(id) {
      currentEditingAdvModelId = id;
      const m = allModelsMap.get(id);
      if (!m) return;

      document.getElementById("advancedModalTitle").textContent = `${t("advModalTitle")} · ${id}`;
      document.getElementById("advModelNameInput").value = m.name || id;
      document.getElementById("advContextWindowInput").value = m.contextWindow || 1048576;
      document.getElementById("advMaxTokensInput").value = m.maxTokens || 65536;
      document.getElementById("advSupportsImagesCheckbox").checked = m.supportsImages !== false;

      // Thinking levels checkboxes
      const levels = m.thinkingLevels || ["off", "low", "medium", "high"];
      document.querySelectorAll("#advThinkingCheckboxes input").forEach(cb => {
        cb.checked = levels.includes(cb.value);
      });

      // Default thinking select
      document.getElementById("advDefaultThinkingSelect").value = m.defaultThinkingLevel || "low";

      document.getElementById("modelAdvancedModal").classList.add("open");
    }

    function closeAdvancedModal() {
      document.getElementById("modelAdvancedModal").classList.remove("open");
      currentEditingAdvModelId = null;
    }

    function saveAdvancedModal() {
      if (!currentEditingAdvModelId) return;
      const m = allModelsMap.get(currentEditingAdvModelId);
      if (!m) return;

      m.name = document.getElementById("advModelNameInput").value.trim() || m.id;
      m.contextWindow = parseInt(document.getElementById("advContextWindowInput").value, 10) || 1048576;
      m.maxTokens = parseInt(document.getElementById("advMaxTokensInput").value, 10) || 65536;
      m.supportsImages = document.getElementById("advSupportsImagesCheckbox").checked;

      const checkedLevels = [];
      document.querySelectorAll("#advThinkingCheckboxes input:checked").forEach(cb => {
        checkedLevels.push(cb.value);
      });
      m.thinkingLevels = checkedLevels.length > 0 ? checkedLevels : ["off"];
      m.defaultThinkingLevel = document.getElementById("advDefaultThinkingSelect").value;

      allModelsMap.set(currentEditingAdvModelId, m);
      closeAdvancedModal();
      renderAvailableList();
      renderConfiguredList();
      showToast(t("toastAdvUpdated", { id: m.id }));
    }

    // Add Custom Model
    function addCustomModel() {
      const input = document.getElementById("customModelIdInput");
      const id = (input.value || "").trim();
      if (!id) {
        showToast(t("toastEnterValidId"));
        return;
      }
      if (allModelsMap.has(id)) {
        if (!configuredIds.includes(id)) {
          configuredIds.push(id);
          renderAvailableList();
          renderConfiguredList();
          showToast(t("toastModelAdded", { id }));
        } else {
          showToast(t("toastModelAlreadyAdded"));
        }
        input.value = "";
        return;
      }

      const newModel = {
        id,
        name: `${id} (${t("customSuffix")})`,
        contextWindow: 1048576,
        maxTokens: 65536,
        supportsImages: true,
        thinkingLevels: ["off", "low", "medium", "high"],
        defaultThinkingLevel: "low",
        enabled: true,
        isCustom: true
      };

      allModelsMap.set(id, newModel);
      configuredIds.push(id);
      input.value = "";
      renderAvailableList();
      renderConfiguredList();
      showToast(t("toastCustomModelAdded", { id }));
    }

    // Toggle All Selection in Left Column
    function toggleAllAvailable() {
      const allIds = Array.from(allModelsMap.keys());
      const allSelected = allIds.every(id => configuredIds.includes(id));
      if (allSelected) {
        configuredIds = [];
      } else {
        configuredIds = [...allIds];
      }
      renderAvailableList();
      renderConfiguredList();
    }

    // Fetch Remote Models
    async function fetchRemoteList() {
      const btn = document.getElementById("btnFetchRemote");
      btn.classList.add("loading");
      try {
        const res = await window.pluginBridge.invoke("antigravity:fetch-models", {});
        if (res && res.ok && Array.isArray(res.models)) {
          for (const m of res.models) {
            if (!allModelsMap.has(m.id)) {
              allModelsMap.set(m.id, m);
            }
          }
          renderAvailableList();
          renderConfiguredList();
          showToast(res.source === "remote" ? t("toastRemoteSyncSuccess") : t("toastRemoteRefreshed"));
        }
      } catch (err) {
        showToast(t("toastRemoteFetchFailed", { error: err.message || t("unknownError") }));
      } finally {
        btn.classList.remove("loading");
      }
    }

    // Save Configuration
    async function saveAllConfig() {
      const accountName = (document.getElementById("accountNameInput").value || "").trim() || "Google Antigravity";
      const orderedModels = configuredIds.map(id => allModelsMap.get(id)).filter(Boolean);

      if (orderedModels.length === 0) {
        showToast(t("toastSelectAtLeastOne"));
        return;
      }

      const customIds = Array.from(allModelsMap.values()).filter(m => m.isCustom).map(m => m.id);

      try {
        const res = await window.pluginBridge.invoke("antigravity:save-config", {
          accountName,
          models: orderedModels,
          customModels: customIds
        });

        if (res && res.ok) {
          showToast(t("toastSaveSuccess", { count: res.count }));
          try {
            await window.pluginBridge.invoke("ui.showToast", {
              message: t("toastHostUpdated", { count: res.count }),
              level: "success"
            });
          } catch {}
          setTimeout(() => {
            window.pluginBridge.invoke("ui.closePanel", {});
          }, 800);
        } else {
          showToast(t("toastSaveFailed", { error: res.error || t("unknownError") }));
        }
      } catch (err) {
        showToast(t("toastSaveFailed", { error: err.message || t("unknownError") }));
      }
    }

    // Load Initial Config
    async function loadConfig() {
      try {
        const res = await window.pluginBridge.invoke("antigravity:get-config", {});
        if (res && res.ok) {
          if (res.accountName) {
            document.getElementById("accountNameInput").value = res.accountName;
          }
          allModelsMap.clear();
          for (const m of (res.allModels || [])) {
            allModelsMap.set(m.id, m);
          }
          configuredIds = [...(res.configuredModelIds || [])];
          renderAvailableList();
          renderConfiguredList();
        }
      } catch (err) {
        console.error("Failed to load initial config:", err);
      }
    }

    // Event Listeners and Initialization Order
    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Initial synchronous static apply (defaults to navigator language or zh-CN)
      if (typeof navigator !== "undefined" && navigator.language) {
        currentLocale = normalizeLocale(navigator.language);
      }
      applyStaticI18n();

      // 2. Query host locale via pluginBridge.invoke('app.getLocale') if available
      try {
        const hostLocale = await detectInitialLocale();
        if (hostLocale !== currentLocale) {
          currentLocale = hostLocale;
          applyStaticI18n();
        }
      } catch (err) {
        console.warn("Failed to detect initial host locale:", err);
      }

      // 3. Load model configuration from plugin bridge
      loadConfig();

      // 4. Attach UI event handlers
      document.getElementById("btnToggleLocale").addEventListener("click", toggleLocale);
      document.getElementById("searchAvailableInput").addEventListener("input", renderAvailableList);
      document.getElementById("searchConfiguredInput").addEventListener("input", renderConfiguredList);
      document.getElementById("btnToggleAll").addEventListener("click", toggleAllAvailable);
      document.getElementById("btnFetchRemote").addEventListener("click", fetchRemoteList);
      document.getElementById("btnAddCustomModel").addEventListener("click", addCustomModel);
      document.getElementById("customModelIdInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") addCustomModel();
      });

      document.getElementById("btnSave").addEventListener("click", saveAllConfig);
      document.getElementById("btnCancel").addEventListener("click", () => {
        window.pluginBridge.invoke("ui.closePanel", {});
      });

      // Advanced Modals
      document.getElementById("btnHeaderAdvanced").addEventListener("click", () => {
        document.getElementById("globalAdvancedModal").classList.add("open");
      });
      document.getElementById("btnCloseGlobalAdv").addEventListener("click", () => {
        document.getElementById("globalAdvancedModal").classList.remove("open");
      });
      document.getElementById("btnSaveGlobalAdv").addEventListener("click", () => {
        document.getElementById("globalAdvancedModal").classList.remove("open");
      });

      document.getElementById("btnCloseAdvancedModal").addEventListener("click", closeAdvancedModal);
      document.getElementById("btnCancelModal").addEventListener("click", closeAdvancedModal);
      document.getElementById("btnSaveModal").addEventListener("click", saveAdvancedModal);
    });
  </script>
</body>
</html>
